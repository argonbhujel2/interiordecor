{% extends "base.html" %}
{% block title %}Get a Free Quote - {{ settings.business_name }}{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>Request a Free Quote</h1><p>Fill in the details and our team will contact you shortly</p></div></div>
<section class="section">
  <div class="container" style="max-width:800px">
    <form method="POST" action="{{ url_for('main.quote') }}" enctype="multipart/form-data" class="calculator-box">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <div class="form-group"><label>Customer Name *</label><input type="text" name="customer_name" class="form-control" required></div>
        <div class="form-group"><label>Phone Number *</label><input type="tel" name="phone" class="form-control" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control"></div>
        <div class="form-group"><label>Address</label><input type="text" name="address" class="form-control"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Project Location</label><input type="text" name="project_location" class="form-control"></div>
        <div class="form-group"><label>Project Type</label>
          <select name="project_type" class="form-control">
            <option value="">Select</option>
            <option>Residential</option><option>Office</option><option>Hotel</option>
            <option>Restaurant</option><option>School</option><option>Shop</option><option>Commercial</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Required Service</label>
          <select name="required_service" class="form-control">
            <option value="">Select</option>
            {% for s in services %}<option value="{{ s.title }}">{{ s.title }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Ceiling Type</label>
          <select name="ceiling_type" class="form-control">
            <option value="">Select</option>
            <option>Gypsum Board</option><option>False Ceiling</option><option>PVC Ceiling</option><option>Custom Design</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Room Length</label><input type="number" step="0.01" name="room_length" id="room_length" class="form-control"></div>
        <div class="form-group"><label>Room Width</label><input type="number" step="0.01" name="room_width" id="room_width" class="form-control"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Estimated Area</label><input type="number" step="0.01" name="estimated_area" id="estimated_area" class="form-control" readonly></div>
        <div class="form-group"><label>Unit</label>
          <select name="unit" class="form-control"><option value="feet">Feet</option><option value="meter">Meter</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Material Preference</label><input type="text" name="material_preference" class="form-control"></div>
        <div class="form-group"><label>Installation Required</label>
          <select name="installation_required" class="form-control"><option value="yes">Yes</option><option value="no">No (Material Only)</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Preferred Date</label><input type="date" name="preferred_date" class="form-control"></div>
        <div class="form-group"><label>Budget</label><input type="text" name="budget" class="form-control" placeholder="e.g. Rs. 50,000 - 1,00,000"></div>
      </div>
      <div class="form-group"><label>Message</label><textarea name="message" class="form-control"></textarea></div>
      <div class="form-group"><label>Photo Upload</label><input type="file" name="photo" class="form-control" accept="image/*"></div>
      <button type="submit" class="btn btn-primary btn-block">Request Free Quote</button>
    </form>
  </div>
</section>
{% endblock %}
