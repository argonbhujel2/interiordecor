<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Urlabari Interior Decor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--concrete)}
  .login-box{background:white;padding:40px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:400px}
  .login-box h1{text-align:center;margin-bottom:8px}.login-box p{text-align:center;color:var(--gray);margin-bottom:24px}</style>
</head>
<body>
  <div class="login-box">
    <h1 style="font-size:1.4rem">Urlabari Interior Decor</h1>
    <p>Admin Panel</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
  </div>
</body>
</html>
