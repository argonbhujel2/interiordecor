{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if service else 'Add' }} Service{% endblock %}
{% block page_title %}{{ 'Edit' if service else 'Add' }} Service{% endblock %}
{% block content %}
<form method="POST" enctype="multipart/form-data" style="max-width:700px;background:white;padding:32px;border-radius:var(--radius);box-shadow:var(--shadow)">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ service.title if service else '' }}" required></div>
  <div class="form-group"><label>Slug</label><input type="text" name="slug" class="form-control" value="{{ service.slug if service else '' }}"></div>
  <div class="form-group"><label>Short Description</label><textarea name="short_description" class="form-control">{{ service.short_description if service else '' }}</textarea></div>
  <div class="form-group"><label>Description</label><textarea name="description" class="form-control">{{ service.description if service else '' }}</textarea></div>
  <div class="form-group"><label>Features (one per line)</label><textarea name="features" class="form-control">{{ service.features if service else '' }}</textarea></div>
  <div class="form-group"><label>Image</label><input type="file" name="image" class="form-control" accept="image/*"></div>
  <div class="form-check"><input type="checkbox" name="is_active" id="act" {% if not service or service.is_active %}checked{% endif %}><label for="act">Active</label></div>
  <button type="submit" class="btn btn-primary" style="margin-top:20px">Save</button>
  <a href="{{ url_for('admin.services') }}" class="btn btn-outline">Cancel</a>
</form>
{% endblock %}
