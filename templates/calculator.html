{% extends "base.html" %}
{% block title %}Ceiling Cost Calculator - {{ settings.business_name }}{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>Ceiling Cost Calculator</h1><p>Get an instant estimate for your project</p></div></div>
<section class="section">
  <div class="container">
    <form id="calculator-form" class="calculator-box">
      <div class="form-row">
        <div class="form-group"><label>Room Length</label><input type="number" step="0.01" id="room_length" class="form-control" required min="0"></div>
        <div class="form-group"><label>Room Width</label><input type="number" step="0.01" id="room_width" class="form-control" required min="0"></div>
      </div>
      <div class="form-group"><label>Unit</label>
        <select id="unit" class="form-control"><option value="feet">Feet</option><option value="meter">Meter</option></select>
      </div>
      <div class="form-group"><label>Material</label>
        <select id="material" class="form-control">
          {% for mat, prices in pricing.items() %}
          <option value="{{ mat }}">{{ mat }} (Rs. {{ prices.material }}/sqft material)</option>
          {% else %}
          <option value="Gypsum Board">Gypsum Board</option>
          <option value="False Ceiling">False Ceiling</option>
          <option value="PVC Ceiling">PVC Ceiling</option>
          <option value="Custom Design">Custom Design</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Installation</label>
        <select id="installation" class="form-control">
          <option value="material">Material Only</option>
          <option value="both">Material + Installation</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Calculate Estimate</button>
      <div id="calc-result"></div>
    </form>
  </div>
</section>
{% endblock %}
